name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to publish the GitHub Release users download from

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run checks
        run: |
          python -m py_compile main.py downloader.py yt_helper.py prepare_build.py
          python -m unittest discover -s tests -v

      - name: Prepare bundled assets
        run: python prepare_build.py

      - name: Build app executable
        run: python -m PyInstaller --clean --noconfirm VibeDownloader.spec

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $compiler)) { throw 'makensis.exe was not installed by chocolatey.' }
          & $compiler /V2 installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'VibeDownloader_Installer.exe')) { throw 'Installer was not produced.' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VibeDownloader-Windows-x64-Installer
          path: VibeDownloader_Installer.exe
          if-no-files-found: error

      # In-app updater reads /releases/latest and picks the asset whose name
      # contains "Installer", so a tag push must publish a real GitHub Release.
      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag --repo '${{ github.repository }}' 2>$null) {
            gh release upload $tag VibeDownloader_Installer.exe --repo '${{ github.repository }}' --clobber
          } else {
            gh release create $tag VibeDownloader_Installer.exe `
              --repo '${{ github.repository }}' `
              --title "VibeDownloader $tag" `
              --generate-notes
          }
